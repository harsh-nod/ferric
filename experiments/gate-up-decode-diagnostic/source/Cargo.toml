[package]
name = "ferric-gate-up-decode-diagnostic-r1"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
autobins = false

[workspace]

[[bin]]
name = "ferric-qwen3-gate-up-decode-diagnostic"
path = "src/bin/ferric-qwen3-gate-up-decode-diagnostic.rs"
required-features = ["c1-token-program"]

[features]
c1-token-program = ["ferric-m1-engineering-execution-v1/c1-token-program", "c1-ordered64"]
c1-ordered64 = ["ferric-m1-engineering-execution-v1/c1-ordered64", "tp-batch-engineering", "dep:fe2o3-kfd-current-wire"]
model-timestamps = ["ferric-m1-engineering-execution-v1/model-timestamps", "tp-batch-engineering", "dep:fe2o3-kfd-current-wire"]
tp-engineering = ["ferric-m1-engineering-execution-v1/tp-engineering", 
    "fe2o3-kfd/engineering-gfx950",
    "dep:fe2o3-hsaco",
    "dep:ferric-qwen3-tp-kernels-device-v1",
]
tp-batch-engineering = ["ferric-m1-engineering-execution-v1/tp-batch-engineering", 
    "tp-engineering",
    "dep:ferric-qwen3-tp-batch-kernels-device-v2",
    "dep:ferric-qwen3-tp-perf-kernels-device-v3",
    "dep:ferric-qwen3-tp-peer-kernels-device-v4",
    "dep:ferric-qwen3-tp-batch32-roster-bridge-v5",
    "dep:ferric-qwen3-tp-peer32-kernels-device-v6",
    "dep:ferric-qwen3-tp-fp32-head-kernels-device-v7",
    "dep:ferric-qwen3-tp-fp32-head32-kernels-device-v8",
    "dep:ferric-qwen3-tp-large-kv-kernels-device-v9",
    "dep:ferric-qwen3-draft-batch32-kernels-device-v10",
    "dep:ferric-qwen3-tp-fp32-argmax-kernels-device-v11",
    "dep:ferric-qwen3-tp-wave-query-hoist-kernels-device-v14",
    "dep:ferric-qwen3-tp-wave-rmsnorm-kernels-device-v15",
    "dep:ferric-qwen3-tp-c1-kv-copy-kernels-device-v19",
]
qualification-fault-injection = ["ferric-m1-engineering-execution-v1/qualification-fault-injection", 
    "ferric-engine/qualification-fault-injection",
    "dep:fe2o3-service-host",
]

[dependencies]
ferric-m1-engineering-execution-v1 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/adapters/m1-engineering-execution-v1", version = "=0.1.0", default-features = false }
# Only the optional ordered64/timestamp/token wire cohort migrates here.
# Legacy GFX942, ordinary TP, peer, and observation-schema pins remain unmigrated.
fe2o3-kfd-current-wire = { package = "fe2o3-kfd", git = "https://github.com/harsh-nod/fe2o3.git", rev = "da6b561c5a3f12acc5b0e6da74c808273e728710", version = "=0.1.0", optional = true, default-features = false, features = ["engineering-gfx950"] }
fe2o3-amdhsa-loader = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0" }
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0" }
fe2o3-hsaco = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0", optional = true }
fe2o3-hsaco-finalize = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0" }
fe2o3-kfd = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0" }
fe2o3-service-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5a503c04f5ae107a3b3e951ec970b36c5d6a9a79", version = "=0.1.0", optional = true }
ferric-build = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/crates/ferric-build", version = "=0.1.0" }
ferric-engine = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/crates/ferric-engine", version = "=0.1.0" }
ferric-non-authoritative-program-source-v1 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/crates/ferric-non-authoritative-program-source-v1", version = "=0.1.0" }
ferric-qwen3-all-kernels-device-v1 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-all-kernels-v1", version = "=0.1.0" }
ferric-qwen3-tp-kernels-device-v1 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-kernels-v1", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-batch-kernels-device-v2 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-batch-kernels-v2", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-perf-kernels-device-v3 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-perf-kernels-v3", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950", "mfma"] }
ferric-qwen3-tp-peer-kernels-device-v4 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-peer-kernels-v4", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-batch32-roster-bridge-v5 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/adapters/qwen3-tp-batch32-roster-bridge-v5", version = "=0.1.0", optional = true, default-features = false }
ferric-qwen3-tp-peer32-kernels-device-v6 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-peer32-kernels-v6", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-fp32-head-kernels-device-v7 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-fp32-head-kernels-v7", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-fp32-head32-kernels-device-v8 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-fp32-head32-kernels-v8", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-large-kv-kernels-device-v9 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-large-kv-kernels-v9", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-draft-batch32-kernels-device-v10 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-draft-batch32-kernels-v10", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-fp32-argmax-kernels-device-v11 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-fp32-argmax-kernels-v11", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-wave-query-hoist-kernels-device-v14 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-wave-query-hoist-kernels-v14", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-wave-rmsnorm-kernels-device-v15 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-wave-rmsnorm-kernels-v15", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-tp-c1-kv-copy-kernels-device-v19 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/device/qwen3-tp-c1-kv-copy-kernels-v19", version = "=0.1.0", optional = true, default-features = false, features = ["gfx950"] }
ferric-qwen3-all-kernels-worker-v3-verifier-v1 = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/adapters/qwen3-all-kernels-worker-v3-verifier-v1", version = "=0.1.0" }
ferric-spec = { path = "/tmp/ferric-v16-emitter-b95a642-r1/gate-up-native-library-a003/source/crates/ferric-spec", version = "=0.1.0" }
rustix = { version = "=1.1.4", features = ["event", "fs", "net", "process", "rand", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
toml = "=1.1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"

[profile.release]
# Applies to every standalone R33 release target, including the supervised
# daemon when its concrete entry point is wired to this reviewed shell.
panic = "abort"

