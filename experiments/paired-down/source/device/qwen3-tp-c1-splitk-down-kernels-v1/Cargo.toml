[package]
name = "ferric-qwen3-tp-c1-splitk-down-kernels-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = []
gfx950 = []
splitk8-down-r1 = ["gfx950"]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "84ab85a424c821c9c2eca155baa5e33ea064349a", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "84ab85a424c821c9c2eca155baa5e33ea064349a", version = "=0.1.0" }

[dev-dependencies]
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lib]
name = "ferric_qwen3_tp_c1_splitk_down_kernels_device_v1"
path = "src/lib.rs"
