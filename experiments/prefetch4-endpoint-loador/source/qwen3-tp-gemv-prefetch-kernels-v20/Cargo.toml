[package]
name = "ferric-qwen3-tp-gemv-prefetch-kernels-device-v20"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx950"]
gfx950 = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "84ab85a424c821c9c2eca155baa5e33ea064349a", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "84ab85a424c821c9c2eca155baa5e33ea064349a", version = "=0.1.0" }

[dev-dependencies]
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }

[lib]
name = "ferric_qwen3_tp_gemv_prefetch_kernels_device_v20"
path = "src/lib.rs"
