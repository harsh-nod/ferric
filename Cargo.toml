[workspace]
members = [
    "crates/ferric-engine",
    "crates/ferric-spec",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
vstd = { git = "https://github.com/verus-lang/verus.git", rev = "b677dd5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
