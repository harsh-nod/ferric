[workspace]
members = [
    "benches/m1",
    "crates/ferric-build",
    "crates/ferric-engine",
    "crates/ferric-generated-runner",
    "crates/ferric-kernels",
    "crates/ferric-qwen-kernels",
    "crates/ferric-spec",
    "proofs/m1",
]
exclude = [
    "device/qwen3-gemm-v1",
    "device/qwen3-logits-v1",
    "device/qwen3-paged-decode-v1",
    "device/qwen3-prefill-v1",
    "device/qwen3-rmsnorm-v1",
    "device/qwen3-swiglu-v1",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97.1"
version = "0.1.0"

[workspace.dependencies]
fe2o3-amdhsa-loader = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-amd-target = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-aql = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-kfd = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-artifact-transaction = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-compiler-ffi = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-hsaco = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-hsaco-finalize = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-llvm-handoff = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-llvm-text = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
fe2o3-service-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
reserved-fe2o3-symbols = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2f6da870a31b8e430fd0af9c756ca86685e67572" }
rustix = { version = "=1.1.4", features = ["fs"] }
sha2 = "0.11.0"
vstd = { git = "https://github.com/verus-lang/verus.git", rev = "b677dd5" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Direct Verus bodies retain linear values and proof-only control flow after
# macro erasure in forms that these style lints cannot interpret.
if_same_then_else = "allow"
manual_let_else = "allow"
needless_pass_by_value = "allow"
semicolon_if_nothing_returned = "allow"
single_match = "allow"
single_match_else = "allow"
too_many_lines = "allow"
unused_self = "allow"
used_underscore_binding = "allow"
