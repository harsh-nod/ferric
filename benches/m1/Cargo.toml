[package]
name = "ferric-m1-benchmarks"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[lib]
path = "support.rs"

[[bin]]
name = "ferric-m1-differential"
path = "differential.rs"

[[bin]]
name = "ferric-m1-adversarial"
path = "adversarial.rs"

[[bin]]
name = "ferric-m1-d10"
path = "d10.rs"

[[bin]]
name = "ferric-m1-speculation"
path = "speculation.rs"

[[bin]]
name = "ferric-m1-serving"
path = "serving.rs"

[dependencies]
ferric-engine = { path = "../../crates/ferric-engine" }
num-bigint = "=0.4.8"
rustix = { workspace = true, features = ["process"] }
serde_json = "=1.0.151"
sha2.workspace = true
vstd.workspace = true

[package.metadata.verus]
verify = true

[lints]
workspace = true
