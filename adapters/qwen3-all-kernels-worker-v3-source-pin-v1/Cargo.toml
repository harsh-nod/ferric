[package]
name = "ferric-qwen3-all-kernels-worker-v3-source-pin-v1"
description = "Authority-free source-pin extraction for Ferric's aggregate Worker V3 envelope"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
autobins = false

# This protocol adapter follows the current Worker V3 wire without changing
# the legacy Ferric workspace dependency closure.
[workspace]

[[bin]]
name = "ferric-qwen3-all-kernels-worker-v3-source-pin-v1"
path = "src/main.rs"

[dependencies]
fe2o3-compiler-ffi = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ff21f24f5349d78583a2a832ba3aa37bf3e0846c", version = "=0.1.0" }
fe2o3-runtime-protocol = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ff21f24f5349d78583a2a832ba3aa37bf3e0846c", version = "=0.1.0" }
serde_json = "=1.0.151"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
