[package]
name = "ferric-tp-peer-engineering-worker-v4"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
fe2o3-kfd = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ae26717922b1fb7ad62fdd5ad70814d83eb01177", features = ["engineering-gfx950"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[lints.rust]
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
all = "deny"
undocumented_unsafe_blocks = "deny"
