[package]
name = "ferric-qwen3-swiglu-worker-v3-envelope-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

# Keep this adapter on the evolving Worker V3 protocol without changing the
# legacy Ferric workspace's fe2o3 dependency closure.
[workspace]

[dependencies]
fe2o3-runtime-protocol = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ff21f24f5349d78583a2a832ba3aa37bf3e0846c", version = "=0.1.0" }
ferric-engine = { path = "../../crates/ferric-engine" }
sha2 = "0.11.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
