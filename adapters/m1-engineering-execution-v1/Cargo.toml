[package]
name = "ferric-m1-engineering-execution-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
autobins = false

[[bin]]
name = "ferric-m1-engineering-target-smoke"
path = "src/bin/ferric-m1-engineering-target-smoke.rs"

# This non-authoritative engineering tool is intentionally outside Ferric's
# verified production workspace and runtime dependency closure.
[workspace]

[dependencies]
fe2o3-amdhsa-loader = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5c4759711775210d3094fd71ebc579fdd00c4db8", version = "=0.1.0" }
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5c4759711775210d3094fd71ebc579fdd00c4db8", version = "=0.1.0" }
fe2o3-hsaco-finalize = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5c4759711775210d3094fd71ebc579fdd00c4db8", version = "=0.1.0" }
fe2o3-kfd = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "5c4759711775210d3094fd71ebc579fdd00c4db8", version = "=0.1.0" }
ferric-build = { path = "../../crates/ferric-build", version = "=0.1.0" }
ferric-engine = { path = "../../crates/ferric-engine", version = "=0.1.0" }
ferric-non-authoritative-program-source-v1 = { path = "../../crates/ferric-non-authoritative-program-source-v1", version = "=0.1.0" }
ferric-qwen3-all-kernels-device-v1 = { path = "../../device/qwen3-all-kernels-v1", version = "=0.1.0" }
ferric-spec = { path = "../../crates/ferric-spec", version = "=0.1.0" }
rustix = { version = "=1.1.4", features = ["fs", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"

[dev-dependencies]
toml = "=1.1.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
