<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img">
<title>Absolute packet interval family means, same scale for prompt and decode</title>
<rect width="100%" height="100%" fill="white"/>
