-size="10" fill="#222222">16.066</text><text x="642" y="658" font-family="sans-serif" font-size="12" fill="#222222">Position 2</text><rect x="824" y="238.64567022959994" width="37" height="395.35432977040006" fill="#257b75"><title>A1: baseline; position 3; 20.171139274 host seconds</title></rect><text x="842.5" y="230.64567022959994" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">20.171</text><rect x="872" y="238.8214923236" width="37" height="395.1785076764" fill="#ac4b60"><title>B: admission cache; position 3; 20.162168759 host seconds</title></rect><text x="890.5" y="230.8214923236" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">20.162</text><rect x="920" y="236.37726948239992" width="37" height="397.6227305176001" fill="#5965a5"><title>A2: baseline repeat; position 3; 20.286874006 host seconds</title></rect><text x="938.5" y="228.37726948239992" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">20.287</text><rect x="968" y="320.01937819200003" width="37" height="313.98062180799997" fill="#78642b"><title>C: shared currentness; position 3; 16.019419480 host seconds</title></rect><text x="986.5" y="312.01937819200003" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#222222">16.019</text><text x="877" y="658" font-family="sans-serif" font-size="12" fill="#222222">Position 3</text><text x="24" y="693" font-family="sans-serif" font-size="12" fill="#222222">Positions are different steps, not repeated samples. No additive cost attribution or kernel-overlap inference.</text><text x="24" y="716" font-family="sans-serif" font-size="12" fill="#222222">Shared host, no performance isolation. Another compiler job was observed during C preflight.</text></svg>