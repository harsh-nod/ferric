<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 740" width="1100" height="740" role="img"><title>Finite prefix host-policy diagnostics on MI350</title><rect x="0" y="0" width="1100" height="740" fill="#ffffff" /><text x="24" y="28" font-family="sans-serif" font-size="18" fill="#222222">Finite prefix host-policy diagnostics on MI350</text><text x="24" y="53" font-family="sans-serif" font-size="12" fill="#222222">One four-forward run per arm, in A1 / B / A2 / C order. Inclusive host wall time; lower is shorter.</text><text x="24" y="75" font-family="sans-serif" font-size="12" fill="#222222">Native parity and lifecycle passed. Not GPU time, sustained decode throughput, or a confidence interval.</text><rect x="30" y="96" width="12" height="12" fill="#257b75" /><text x="50" y="107" font-family="sans-serif" font-size="12" fill="#222222">A1: baseline</text><rect x="290" y="96" width="12" height="12" fill="#ac4b60" /><text x="310" y="107" font-family="sans-serif" font-size="12" fill="#222222">B: admission cache</text><rect x="550" y="96" width="12" height="12" fill="#5965a5" /><text x="570" y="107" font-family="sans-serif" font-size="12" fill="#222222">A2: baseline repeat</text><rect x="810" y="96" width="12" height="12" fill="#78642b" /><text x="830" y="107" font-family="sans-serif" font-size="12" fill="#222222">C: shared currentness</text><line x1="94" x2="1032" y1="634.0" y2="634.0" stroke="#dddddd" /><text x="54" y="638.0" font-family="sans-serif" font-size="12" fill="#222222">0</text><line x1="94" x2="1032" y1="536.0" y2="536.0" stroke="#dddddd" /><text x="54" y="540.0" font-family="sans-serif" font-size="12" fill="#222222">5</text><line x1="94" x2="1032" y1="438.0" y2="438.0" stroke="#dddddd" /><text x="54" y="442.0" font-family="sans-serif" font-size="12" fill="#222222">10</text><line x1="94" x2="1032" y1="340.0" y2="340.0" stroke="#dddddd" /><text x="54" y="344.0" font-family="sans-serif" font-size="12" fill="#222222">15</text><line x1="94" x2="1032" y1="2