"57" height="280.3398409" fill="#257b75"><title>CPU633 worker: shared fence; position 3; 16.019419480 host seconds</title></rect><text x="789.5" y="206.6601591" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">16.019</text><rect x="837" y="358.0473597025" width="57" height="137.95264029749998" fill="#ad4560"><title>CPU475 worker: consolidated fence; position 3; 7.883008017 host seconds</title></rect><text x="865.5" y="349.0473597025" font-family="sans-serif" font-size="12" fill="#222222" text-anchor="middle">7.883</text><text x="757" y="521" font-family="sans-serif" font-size="12" fill="#222222">Position 3</text><text x="24" y="553" font-family="sans-serif" font-size="12" fill="#222222">Four-forward sums: 61.458 s before; 30.394 s after. 18,720 duplicate rank-full checks removed.</text><text x="24" y="577" font-family="sans-serif" font-size="12" fill="#222222">Shared group checks, admissions, dispatches and transfer counts retained. All 152 native tensor rows matched.</text><text x="24" y="600" font-family="sans-serif" font-size="12" fill="#222222">Shared host, no performance isolation. Different positions are not independent repeated samples.</text></svg>