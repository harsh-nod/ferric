<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 194" width="1100" height="194" role="img"><title>BF16 argmax: observed Qwen3-8B post-first decode rates</title><rect x="0" y="0" width="1100" height="194" fill="#ffffff" /><text x="24" y="28" font-family="sans-serif" font-size="18" fill="#222222">BF16 argmax: observed Qwen3-8B post-first decode rates</text><text x="24" y="52" font-family="sans-serif" font-size="12" fill="#222222">One unwarmed request per image; no stable speedup or isolated GPU-time claim.</text><text x="24" y="94" font-family="sans-serif" font-size="12" fill="#222222">Scalar argmax control</text><rect x="290" y="76" width="576.4832291353196" height="25" fill="#257b75" /><text x="874.4832291353196" y="94" font-family="sans-serif" font-size="12" fill="#222222">0.822924</text><text x="24" y="134" font-family="sans-serif" font-size="12" fill="#222222">Cooperative Wave64 argmax</text><rect x="290" y="116" width="589.2857142857142" height="25" fill="#ac4b60" /><text x="887.2857142857142" y="134" font-family="sans-serif" font-size="12" fill="#222222">0.841199</text><text x="24" y="178" font-family="sans-serif" font-size="12" fill="#222222">31 intervals per request; tokens/s excludes first-token latency and setup.</text></svg>