[package]
name = "ferric-qwen3-rmsnorm-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# Device source is pinned independently of Ferric's stable host workspace. The
# package grants no artifact, dispatch, or M1 authority.
[workspace]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "16da71edd823e0d5c16529bfbbedb4f9dd8e70c6", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "16da71edd823e0d5c16529bfbbedb4f9dd8e70c6", version = "=0.1.0" }

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lib]
name = "ferric_qwen3_rmsnorm_device_v1"
path = "src/lib.rs"
