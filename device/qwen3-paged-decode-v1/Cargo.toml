[package]
name = "ferric-qwen3-paged-decode-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# This package is intentionally independent of Ferric's stable host workspace.
# The revision is provisional until the final M1 fe2o3 compiler/runtime chain lands.
[workspace]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "e98f280fb9aeb53b7248793b0a759952d8f58106", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "e98f280fb9aeb53b7248793b0a759952d8f58106", version = "=0.1.0" }

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lib]
name = "ferric_qwen3_paged_decode_device_v1"
path = "src/lib.rs"
