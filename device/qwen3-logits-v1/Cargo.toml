[package]
name = "ferric-qwen3-logits-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# This package is intentionally independent of Ferric's stable host workspace.
# The exact reviewed compiler/runtime source pin grants no artifact or runtime authority.
[workspace]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "9f97985ee0a4a8ef0bc8f0fa0fd33771c8180592", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "9f97985ee0a4a8ef0bc8f0fa0fd33771c8180592", version = "=0.1.0" }

[dev-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lib]
name = "ferric_qwen3_logits_device_v1"
path = "src/lib.rs"
