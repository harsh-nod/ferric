[package]
name = "ferric-qwen3-tp-prefill-k2-kernels-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = []
gfx950 = []
paired-prefill-k16-r1 = ["gfx950"]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "55c1a9b6da5e835e4cec9e1d69609ce884c1a5c9", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "55c1a9b6da5e835e4cec9e1d69609ce884c1a5c9", version = "=0.1.0" }

[dev-dependencies]
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lib]
name = "ferric_qwen3_tp_prefill_k2_kernels_device_v1"
path = "src/lib.rs"
