[package]
name = "ferric-qwen3-tp-perf-kernels-device-v3"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx950", "mfma"]
gfx950 = []
mfma = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "902fef6e1478b3ac677e5456b2a2d1f917456fba", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "902fef6e1478b3ac677e5456b2a2d1f917456fba", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lib]
name = "ferric_qwen3_tp_perf_kernels_device_v3"
path = "src/lib.rs"
