[package]
name = "ferric-qwen3-tp-batch-kernels-device-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx942"]
gfx942 = []
gfx950 = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "6f6a67bb2f6de70a1c5533bbcde1b09449c37359", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "6f6a67bb2f6de70a1c5533bbcde1b09449c37359", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lib]
name = "ferric_qwen3_tp_batch_kernels_device_v2"
path = "src/lib.rs"
