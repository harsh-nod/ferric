[package]
name = "ferric-qwen3-tp-large-kv-kernels-device-v9"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx950"]
gfx950 = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ae441734f27ef35c26baf7b3a6281852cd544de9", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "ae441734f27ef35c26baf7b3a6281852cd544de9", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full"] }

[lib]
name = "ferric_qwen3_tp_large_kv_kernels_device_v9"
path = "src/lib.rs"
