[package]
name = "ferric-qwen3-tp-packed-gate-up-kernels-v8"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = []
gfx950 = []
fused-gate-up-r1 = ["gfx950", "dep:fe2o3-host"]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "b7d5f2bf7bf9e66037df1ff1d7ca2738ffdf98dd", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "b7d5f2bf7bf9e66037df1ff1d7ca2738ffdf98dd", version = "=0.1.0", optional = true }

[dev-dependencies]
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full"] }

[lib]
name = "ferric_qwen3_tp_packed_gate_up_kernels_v8"
path = "src/lib.rs"
