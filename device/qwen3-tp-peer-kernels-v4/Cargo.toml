[package]
name = "ferric-qwen3-tp-peer-kernels-device-v4"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx950"]
gfx950 = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "4fbc0a34c7938474406d37a45e7972ea8b1ec277", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "4fbc0a34c7938474406d37a45e7972ea8b1ec277", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full"] }

[lib]
name = "ferric_qwen3_tp_peer_kernels_device_v4"
path = "src/lib.rs"
