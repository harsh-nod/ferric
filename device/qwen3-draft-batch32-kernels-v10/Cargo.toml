[package]
name = "ferric-qwen3-draft-batch32-kernels-device-v10"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[features]
default = ["gfx950"]
gfx950 = []

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "bd1ed7d559b1a372644a78b1ede7e6057e5ccbc7", version = "=0.1.0" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "bd1ed7d559b1a372644a78b1ede7e6057e5ccbc7", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "=2.0.119", features = ["full", "visit", "extra-traits"] }

[lib]
name = "ferric_qwen3_draft_batch32_kernels_device_v10"
path = "src/lib.rs"
