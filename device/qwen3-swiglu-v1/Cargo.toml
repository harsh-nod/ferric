[package]
name = "ferric-qwen3-swiglu-device-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

# The device compiler is nightly-pinned independently of Ferric's stable host
# workspace. This also prevents the in-progress V3 port from granting authority
# to the retained Worker V2 host path.
[workspace]

[dependencies]
fe2o3-device = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2347052f67cfb67f433d06c4f75c222a4a5a0b45", version = "=0.1.0" }
fe2o3-host = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "2347052f67cfb67f433d06c4f75c222a4a5a0b45", version = "=0.1.0" }

[dev-dependencies]
syn = { version = "2", features = ["full"] }

[lib]
name = "ferric_qwen3_swiglu_device_v1"
path = "src/lib.rs"
