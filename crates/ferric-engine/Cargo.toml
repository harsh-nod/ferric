[package]
name = "ferric-engine"
description = "Safe runtime state machines for Ferric inference"
autobins = false
edition.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[features]
qualification-fault-injection = ["fe2o3-service-host/qualification-fault-injection"]

[[bin]]
name = "ferric-m1-qualification-capture"
path = "src/bin/ferric-m1-qualification-capture.rs"

[[bin]]
name = "ferric-m1-packet-diagnostic"
path = "src/bin/ferric-m1-packet-diagnostic.rs"

[[bin]]
name = "ferric-m1-hardware-harness"
path = "src/bin/ferric-m1-hardware-harness.rs"

[[bin]]
name = "ferric-m1-worker-v3-preflight"
path = "src/bin/ferric-m1-worker-v3-preflight.rs"

[dependencies]
fe2o3-amdhsa-loader.workspace = true
fe2o3-amd-target.workspace = true
fe2o3-aql.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-host.workspace = true
fe2o3-kfd.workspace = true
fe2o3-runtime-protocol.workspace = true
fe2o3-service-host.workspace = true
ferric-build = { path = "../ferric-build" }
ferric-kernels = { path = "../ferric-kernels" }
ferric-qwen-kernels = { path = "../ferric-qwen-kernels" }
ferric-qwen3-gemm-device-v1 = { path = "../../device/qwen3-gemm-v1" }
ferric-qwen3-logits-device-v1 = { path = "../../device/qwen3-logits-v1" }
ferric-qwen3-paged-decode-device-v1 = { path = "../../device/qwen3-paged-decode-v1" }
ferric-qwen3-prefill-device-v1 = { path = "../../device/qwen3-prefill-v1" }
ferric-qwen3-rmsnorm-device-v1 = { path = "../../device/qwen3-rmsnorm-v1" }
ferric-qwen3-rope-kv-device-v1 = { path = "../../device/qwen3-rope-kv-v1" }
ferric-qwen3-swiglu-device-v1 = { path = "../../device/qwen3-swiglu-v1" }
ferric-spec = { path = "../ferric-spec" }
rustix.workspace = true
serde_json = "=1.0.151"
sha2.workspace = true
vstd.workspace = true

[dev-dependencies]
fe2o3-hsaco.workspace = true
ferric-build = { path = "../ferric-build", features = ["test-fixtures"] }

[package.metadata.verus]
verify = true

[lints]
workspace = true
