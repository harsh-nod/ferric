[package]
name = "ferric-property-binder"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace]

[dependencies]
fe2o3-proof-contracts = { git = "https://github.com/harsh-nod/fe2o3.git", rev = "a6fa86b5ccf8f0438925cfec8f48a5d713874da3" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
too-many-lines = { level = "allow", priority = 1 }
