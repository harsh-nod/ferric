[package]
name = "ferric-owned-kernel-admission-bench-v1"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
fe2o3-amdhsa-loader = { path = "../runtime/crates/fe2o3-amdhsa-loader" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 2
debug-assertions = true
overflow-checks = true
panic = "unwind"
