<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img"><title>Four-forward default versus shared-full host observations</title><desc>One fixed-order Qwen3-8B BF16 TP2 pair on MI350. Forward host wall time and inclusive full-currentness counter sums are separate panels. Not GPU timing, a sustained benchmark, or independent numerical acceptance.</desc><rect width="1100" height="720" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="24" text-anchor="start" font-weight="600" x="40" y="36" fill="#202522">Qwen3-8B: default versus shared-full</text><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" font-weight="400" x="40" y="61" fill="#202522">BF16, TP2, MI350 | one fixed-order four-forward diagnostic</text><rect x="700" y="82" width="16" height="16" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" x="724" y="96" fill="#202522">Default</text><rect x="875" y="82" width="16" height="16" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" x="899" y="96" fill="#202522">Shared-full</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="600" x="40" y="125" fill="#202522">Forward host wall time (seconds)</text><line x1="95" x2="1050" y1="325.0" y2="325.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="330.0" fill="#202522">0.0</text><line x1="95" x2="1050" y1="293.0" y2="293.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="298.0" fill="#202522">3.0</text><line x1="95" x2="1050" y1="261.0" y2="261.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="266.0" fill="#202522">6.0</text><line x1="95" x2="1050" y1="229.0" y2="229.0" stroke="#e0e4e1"