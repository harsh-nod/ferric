 width="38" height="53.849922101333334" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="707" y="533.1500778986667" fill="#202522">5.048</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="920" y="619" fill="#202522">Position 3</text><rect x="879" y="469.4630413653333" width="38" height="125.53695863466666" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="898" y="461.4630413653333" fill="#202522">11.769</text><rect x="923" y="540.9881646933334" width="38" height="54.01183530666667" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="942" y="532.9881646933334" fill="#202522">5.064</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="657" fill="#202522">Counter sum = rank-full + group-full + publication-full; nested read/write/dispatch timers are excluded.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="680" fill="#202522">Counter intervals and forward boundaries differ. Bars are not an additive latency partition or GPU timings.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="703" fill="#202522">Single-pair order and warmed-cache effects remain unresolved. This is not the 2,048/256 throughput target.</text></svg>