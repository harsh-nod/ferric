<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img"><title>Outer hidden-read host wall time for four serial AR4 runs</title><desc>Two independent runs per mode. Four colored forward observations within each run are correlated. Not GPU time or end-to-end speedup.</desc><rect x="0" y="0" width="1180" height="720" fill="#ffffff" /><text x="64" y="43" fill="#20242a" font-family="sans-serif" font-size="27">Outer Hidden-Read Host Wall Time</text><text x="64" y="72" fill="#20242a" font-family="sans-serif" font-size="16">Serial ABBA; two independent runs per mode; four correlated forwards per run</text><text x="64" y="104" fill="#20242a" font-family="sans-serif" font-size="15">Sum of 36 disjoint layer intervals per forward, seconds</text><line x1="130" x2="1110" y1="530" y2="530" stroke="#dce1e4" stroke-width="1" /><text x="112" y="535" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">0.000</text><line x1="130" x2="1110" y1="456" y2="456" stroke="#dce1e4" stroke-width="1" /><text x="112" y="461" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">0.420</text><line x1="130" x2="1110" y1="382" y2="382" stroke="#dce1e4" stroke-width="1" /><text x="112" y="387" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">0.840</text><line x1="130" x2="1110" y1="308" y2="308" stroke="#dce1e4" stroke-width="1" /><text x="112" y="313" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">1.260</text><line x1="130" x2="1110" y1="234" y2="234" stroke="#dce1e4" stroke-width="1" /><text x="112" y="239" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">1.680</text><line x1="130" x2="1110" y1="160" y2="160" stroke="#dce1e4" stroke-width="1" /><text x="112" y="165" fill="#20242a" font-family="sans-serif" font-size="14" text-anchor="end">2.100</text><rect x="205" y="440.287152" width="104" height="89.712848" fill="#276a8a"><title>control-0 forw