<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title description"><title id="title">Observed host wall by forward</title><desc id="description">Four grouped stacked host-wall bars per mode. One observation per mode; not GPU time or a controlled benchmark.</desc><rect width="1180" height="720" fill="#ffffff" /><text x="50" y="42" fill="#24292f" font-family="sans-serif" font-size="26" text-anchor="start">Observed Host Wall by Forward</text><text x="50" y="69" fill="#24292f" font-family="sans-serif" font-size="15" text-anchor="start">Disjoint snapshot intervals; one conservative case and one shared-full case</text><text x="50" y="95" fill="#525b65" font-family="sans-serif" font-size="13" text-anchor="start">Not GPU time, throughput, overlap, or a controlled repeated benchmark</text><rect x="50" y="119" width="16" height="16" fill="#168977" /><text x="74" y="132" fill="#24292f" font-family="sans-serif" font-size="14" text-anchor="start">Prefix</text><rect x="208" y="119" width="16" height="16" fill="#ba4567" /><text x="232" y="132" fill="#24292f" font-family="sans-serif" font-size="14" text-anchor="start">Paired</text><rect x="366" y="119" width="16" height="16" fill="#397db5" /><text x="390" y="132" fill="#24292f" font-family="sans-serif" font-size="14" text-anchor="start">Hidden Read</text><rect x="524" y="119" width="16" height="16" fill="#c6922b" /><text x="548" y="132" fill="#24292f" font-family="sans-serif" font-size="14" text-anchor="start">Other</text><line x1="100" y1="567" x2="1110" y2="567" stroke="#d9dee3" stroke-width="1" /><text x="88" y="571" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">0.00</text><line x1="100" y1="489" x2="1110" y2="489" stroke="#d9dee3" stroke-width="1" /><text x="88" y="493" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">3.20</text><line x1="100" y1="411" x2="1110" y2="411" stroke="#d9dee3" stroke-width="1" /><text x="88" y="415" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">6.40</text><line x1="100" y1="333" x2="1110" y2="333" stroke="#d9dee3" stroke-width="1" /><text x="88" y="337" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">9.60</text><line x1="100" y1="255" x2="1110" y2="255" stroke="#d9dee3" stroke-width="1" /><text x="88" y="259" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">12.80</text><line x1="100" y1="177" x2="1110" y2="177" stroke="#d9dee3" stroke-width="1" /><text x="88" y="181" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="end">16.00</text><text x="50" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="start">Host Seconds</text><g id="forward_0_conservative"><rect x="140" y="485.989" width="58" height="81.011" fill="#168977" data-stage="prefix" data-nanoseconds="3323525422"><title>prefix: 3.323525422 host seconds</title></rect><rect x="140" y="292.833" width="58" height="193.156" fill="#ba4567" data-stage="paired" data-nanoseconds="7924345342"><title>paired: 7.924345342 host seconds</title></rect><rect x="140" y="262.790" width="58" height="30.043" fill="#397db5" data-stage="hidden" data-nanoseconds="1232530213"><title>hidden: 1.232530213 host seconds</title></rect><rect x="140" y="254.797" width="58" height="7.993" fill="#c6922b" data-stage="other" data-nanoseconds="327920133"><title>other: 0.327920133 host seconds</title></rect></g><text x="169" y="591" fill="#24292f" font-family="sans-serif" font-size="11" text-anchor="middle">Conservative</text><text x="169" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="middle">12.808 s</text><g id="forward_0_shared"><rect x="224" y="529.894" width="58" height="37.106" fill="#168977" data-stage="prefix" data-nanoseconds="1522309693"><title>prefix: 1.522309693 host seconds</title></rect><rect x="224" y="446.719" width="58" height="83.174" fill="#ba4567" data-stage="paired" data-nanoseconds="3412278854"><title>paired: 3.412278854 host seconds</title></rect><rect x="224" y="434.276" width="58" height="12.444" fill="#397db5" data-stage="hidden" data-nanoseconds="510518278"><title>hidden: 0.510518278 host seconds</title></rect><rect x="224" y="430.549" width="58" height="3.727" fill="#c6922b" data-stage="other" data-nanoseconds="152886985"><title>other: 0.152886985 host seconds</title></rect></g><text x="253" y="591" fill="#24292f" font-family="sans-serif" font-size="11" text-anchor="middle">Shared Full</text><text x="253" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="middle">5.598 s</text><text x="211" y="620" fill="#24292f" font-family="sans-serif" font-size="15" text-anchor="middle">Forward 0</text><g id="forward_1_conservative"><rect x="385" y="485.487" width="58" height="81.513" fill="#168977" data-stage="prefix" data-nanoseconds="3344133863"><title>prefix: 3.344133863 host seconds</title></rect><rect x="385" y="291.460" width="58" height="194.027" fill="#ba4567" data-stage="paired" data-nanoseconds="7960072926"><title>paired: 7.960072926 host seconds</title></rect><rect x="385" y="261.249" width="58" height="30.211" fill="#397db5" data-stage="hidden" data-nanoseconds="1239440596"><title>hidden: 1.239440596 host seconds</title></rect><rect x="385" y="253.303" width="58" height="7.945" fill="#c6922b" data-stage="other" data-nanoseconds="325958392"><title>other: 0.325958392 host seconds</title></rect></g><text x="414" y="591" fill="#24292f" font-family="sans-serif" font-size="11" text-anchor="middle">Conservative</text><text x="414" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="middle">12.870 s</text><g id="forward_1_shared"><rect x="469" y="529.669" width="58" height="37.331" fill="#168977" data-stage="prefix" data-nanoseconds="1531516028"><title>prefix: 1.531516028 host seconds</title></rect><rect x="469" y="446.093" width="58" height="83.577" fill="#ba4567" data-stage