-stage="paired" data-nanoseconds="3444071616"><title>paired: 3.444071616 host seconds</title></rect><rect x="714" y="433.020" width="58" height="12.572" fill="#397db5" data-stage="hidden" data-nanoseconds="515773141"><title>hidden: 0.515773141 host seconds</title></rect><rect x="714" y="414.146" width="58" height="18.874" fill="#c6922b" data-stage="other" data-nanoseconds="774321370"><title>other: 0.774321370 host seconds</title></rect></g><text x="743" y="591" fill="#24292f" font-family="sans-serif" font-size="11" text-anchor="middle">Shared Full</text><text x="743" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="middle">6.271 s</text><text x="701" y="620" fill="#24292f" font-family="sans-serif" font-size="15" text-anchor="middle">Forward 2</text><g id="forward_3_conservative"><rect x="875" y="484.982" width="58" height="82.018" fill="#168977" data-stage="prefix" data-nanoseconds="3364836568"><title>prefix: 3.364836568 host seconds</title></rect><rect x="875" y="289.889" width="58" height="195.093" fill="#ba4567" data-stage="paired" data-nanoseconds="8003815631"><title>paired: 8.003815631 host seconds</title></rect><rect x="875" y="259.457" width="58" height="30.432" fill="#397db5" data-stage="hidden" data-nanoseconds="1248487593"><title>hidden: 1.248487593 host seconds</title></rect><rect x="875" y="192.025" width="58" height="67.432" fill="#c6922b" data-stage="other" data-nanoseconds="2766447924"><title>other: 2.766447924 host seconds</title></rect></g><text x="904" y="591" fill="#24292f" font-family="sans-serif" font-size="11" text-anchor="middle">Conservative</text><text x="904" y="165" fill="#24292f" font-family="sans-serif" font-size="12" text-anchor="middle">15.384 s</text><g id="forward_3_shared"><rect x="959" y="529.838" width="58" height="37.162" fill="#168977" data-stage="prefix" data-nanoseconds="1524605324"><title>prefix: 1.524605324 host seconds</title></rect><rect x="959" y="446.281" width="58" height="83.557" fill="#ba456