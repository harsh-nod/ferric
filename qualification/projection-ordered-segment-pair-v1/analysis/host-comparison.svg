<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1030" viewBox="0 0 1100 1030" role="img"><title>Four-forward shared-full versus ordered host observations</title><desc>One fixed-order Qwen3-8B BF16 TP2 pair on MI350. Forward host wall time and inclusive full-currentness counter sums are separate panels. Ordered combined residual-to-MLP segments form a third, non-additive panel. Not GPU timing, a sustained benchmark, or independent numerical acceptance.</desc><rect width="1100" height="1030" fill="#ffffff" /><text font-family="Arial, sans-serif" font-size="24" text-anchor="start" font-weight="600" x="40" y="36" fill="#202522">Qwen3-8B: shared-full versus ordered</text><text font-family="Arial, sans-serif" font-size="15" text-anchor="start" font-weight="400" x="40" y="61" fill="#202522">BF16, TP2, MI350 | one fixed-order four-forward diagnostic</text><rect x="700" y="82" width="16" height="16" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" x="724" y="96" fill="#202522">Shared-full</text><rect x="875" y="82" width="16" height="16" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="start" font-weight="400" x="899" y="96" fill="#202522">Ordered</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="600" x="40" y="125" fill="#202522">Forward host wall time (seconds)</text><line x1="95" x2="1050" y1="325.0" y2="325.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="330.0" fill="#202522">0.0</text><line x1="95" x2="1050" y1="293.0" y2="293.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="298.0" fill="#202522">2.0</text><line x1="95" x2="1050" y1="261.0" y2="261.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="266.0" fill="#202522">4.0</text><line x1="95" x2="1050" y1="229.0" y2="229.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="234.0" fill="#202522">6.0</text><line x1="95" x2="1050" y1="197.0" y2="197.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="202.0" fill="#202522">8.0</text><line x1="95" x2="1050" y1="165.0" y2="165.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="170.0" fill="#202522">10.0</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="215" y="349" fill="#202522">Position 0</text><rect x="174" y="241.37288896" width="38" height="83.62711104" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="193" y="233.37288896" fill="#202522">5.227</text><rect x="218" y="244.70171534399998" width="38" height="80.29828465600002" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="237" y="236.70171534399998" fill="#202522">5.019</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="450" y="349" fill="#202522">Position 1</text><rect x="409" y="241.071881408" width="38" height="83.928118592" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="428" y="233.071881408" fill="#202522">5.246</text><rect x="453" y="245.02796035199998" width="38" height="79.972039648" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="472" y="237.02796035199998" fill="#202522">4.998</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="685" y="349" fill="#202522">Position 2</text><rect x="644" y="233.50137496000002" width="38" height="91.49862504" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="663" y="225.50137496000002" fill="#202522">5.719</text><rect x="688" y="237.014155696" width="38" height="87.985844304" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="707" y="229.014155696" fill="#202522">5.499</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="920" y="349" fill="#202522">Position 3</text><rect x="879" y="233.51070952" width="38" height="91.48929048" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="898" y="225.51070952" fill="#202522">5.718</text><rect x="923" y="237.2425656" width="38" height="87.7574344" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="942" y="229.2425656" fill="#202522">5.485</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="600" x="40" y="395" fill="#202522">Full-currentness counter sum (seconds)</text><line x1="95" x2="1050" y1="595.0" y2="595.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="600.0" fill="#202522">0.0</text><line x1="95" x2="1050" y1="563.0" y2="563.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="568.0" fill="#202522">2.0</text><line x1="95" x2="1050" y1="531.0" y2="531.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="536.0" fill="#202522">4.0</text><line x1="95" x2="1050" y1="499.0" y2="499.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="504.0" fill="#202522">6.0</text><line x1="95" x2="1050" y1="467.0" y2="467.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="472.0" fill="#202522">8.0</text><line x1="95" x2="1050" y1="435.0" y2="435.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="440.0" fill="#202522">10.0</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="215" y="619" fill="#202522">Position 0</text><rect x="174" y="522.598294272" width="38" height="72.401705728" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="193" y="514.598294272" fill="#202522">4.525</text><rect x="218" y="528.840939584" width="38" height="66.159060416" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="237" y="520.840939584" fill="#202522">4.135</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="450" y="619" fill="#202522">Position 1</text><rect x="409" y="522.505747632" width="38" height="72.494252368" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="428" y="514.505747632" fill="#202522">4.531</text><rect x="453" y="529.166274656" width="38" height="65.833725344" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="472" y="521.166274656" fill="#202522">4.115</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="685" y="619" fill="#202522">Position 2</text><rect x="644" y="514.898346272" width="38" height="80.101653728" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="663" y="506.898346272" fill="#202522">5.006</text><rect x="688" y="521.312447776" width="38" height="73.687552224" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="707" y="513.312447776" fill="#202522">4.605</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="920" y="619" fill="#202522">Position 3</text><rect x="879" y="514.900091632" width="38" height="80.099908368" fill="#646c76" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="898" y="506.900091632" fill="#202522">5.006</text><rect x="923" y="521.5685401759999" width="38" height="73.431459824" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="942" y="513.5685401759999" fill="#202522">4.589</text><text font-family="Arial, sans-serif" font-size="17" text-anchor="start" font-weight="600" x="40" y="665" fill="#202522">Ordered combined segment sum, 36 layers (host seconds)</text><line x1="95" x2="1050" y1="865.0" y2="865.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="870.0" fill="#202522">0.0</text><line x1="95" x2="1050" y1="833.0" y2="833.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="838.0" fill="#202522">1.0</text><line x1="95" x2="1050" y1="801.0" y2="801.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="806.0" fill="#202522">2.0</text><line x1="95" x2="1050" y1="769.0" y2="769.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="774.0" fill="#202522">3.0</text><line x1="95" x2="1050" y1="737.0" y2="737.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="742.0" fill="#202522">4.0</text><line x1="95" x2="1050" y1="705.0" y2="705.0" stroke="#e0e4e1" /><text font-family="Arial, sans-serif" font-size="14" text-anchor="end" font-weight="400" x="80" y="710.0" fill="#202522">5.0</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="215" y="889" fill="#202522">Position 0</text><rect x="174" y="802.117015488" width="38" height="62.882984512" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="193" y="794.117015488" fill="#202522">1.965</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="450" y="889" fill="#202522">Position 1</text><rect x="409" y="802.511052448" width="38" height="62.488947552" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="428" y="794.511052448" fill="#202522">1.953</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="685" y="889" fill="#202522">Position 2</text><rect x="644" y="802.433813696" width="38" height="62.566186304" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="663" y="794.433813696" fill="#202522">1.955</text><text font-family="Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="400" x="920" y="889" fill="#202522">Position 3</text><rect x="879" y="802.482231712" width="38" height="62.517768288" fill="#16826b" /><text font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" x="898" y="794.482231712" fill="#202522">1.954</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="927" fill="#202522">Counter sum = rank-full + group-full + publication-full; nested read/write/dispatch timers are excluded.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="950" fill="#202522">Counter intervals and forward boundaries differ. Bars are not an additive latency partition or GPU timings.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="973" fill="#202522">Shared first, ordered second; warmed caches and first-use arena costs confound this one pair. No 2,048/256 claim.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="996" fill="#202522">Combined segment includes preflight/staging/fences/waits/checks. Publish/wait/poll are not comparable per-kernel timers.</text><text font-family="Arial, sans-serif" font-size="13" text-anchor="start" font-weight="400" x="40" y="1019" fill="#202522">The ordered segment panel has no legacy counterpart; do not add it to forward wall or full-currentness counters.</text></svg>