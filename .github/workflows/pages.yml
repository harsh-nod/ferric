name: pages-prebuilt

on:
  push:
    branches:
      - pages/prebuilt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'harsh-nod/ferric' && github.ref == 'refs/heads/pages/prebuilt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact prebuilt revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate the admitted static artifact
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_REPOSITORY" = harsh-nod/ferric
          test "$GITHUB_REF" = refs/heads/pages/prebuilt
          test -d public
          test ! -L public
          test -d public/assets
          test ! -L public/assets
          test -d public/data
          test ! -L public/data

          files=(
            app.js
            assets/architecture.svg
            assets/mark.svg
            data/performance.js
            data/project.js
            index.html
            styles.css
          )
          diff -u <(printf '%s\n' "${files[@]}") \
            <(find public -type f -printf '%P\n' | sort)
          test -z "$(find public ! -type d ! -type f -print -quit)"
          test "$(find public -type d -printf '.\n' | wc -l)" -eq 3
          diff -u \
            <(printf '%s\n' .github/workflows/pages.yml; printf 'public/%s\n' "${files[@]}") \
            <(git ls-files | sort)

          total=0
          for file in "${files[@]}"; do
            test -f "public/$file"
            test ! -L "public/$file"
            test "$(stat -c %h "public/$file")" -eq 1
            total=$((total + $(stat -c %s "public/$file")))
          done
          test "$total" -eq 789721
          test "$total" -le 2097152

          # September 18 V4: validated on mi300x-2; native diagnostic archive c1cd3b9448e05076cc935801f82ad99b5b48c3d664ad758628860e50b9f953d6.
          # CPU and final Pages QA archive: 02812d6b11f334a37197e5bac28a66bccc34955d6dcac61ea1fcdf8e21e2e866.
          sha256sum --check --strict <<'SHA256'
          a9c145b4643a7271896437012b293131c7d14ab2e5d4694726e555f5ce288275  public/app.js
          07291c88f57be83ac12bccc73876fb67158ed96ca8efc2e5717d50d98ad9cb69  public/assets/architecture.svg
          5ddc6e2efcaa8eea3fd8f5607cae74813da636f180a34a5ba72cd879e1b6b809  public/assets/mark.svg
          05ad1f50575547c0b0c8244b2912e1d7518258772527f7ff236fdb8d2e42102f  public/data/performance.js
          268900528690b9de3acb80c4863dd86ac484f4184ab1970c25ecf5293a8ca4f8  public/data/project.js
          0985aa7d2f3aff27242e07f23ce67b75773ec57e137adf23772ae6ae20627f28  public/index.html
          96dad9e9ae20db7a97d39b811ef17579955160d7238243b75b609c951675e9aa  public/styles.css
          SHA256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload admitted static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
