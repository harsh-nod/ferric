name: pages-prebuilt

on:
  push:
    branches:
      - pages/prebuilt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'harsh-nod/ferric' && github.ref == 'refs/heads/pages/prebuilt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact prebuilt revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate the admitted static artifact
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_REPOSITORY" = harsh-nod/ferric
          test "$GITHUB_REF" = refs/heads/pages/prebuilt
          test -d public
          test ! -L public
          test -d public/assets
          test ! -L public/assets
          test -d public/data
          test ! -L public/data

          files=(
            app.js
            assets/architecture.svg
            assets/mark.svg
            data/performance.js
            data/project.js
            index.html
            styles.css
          )
          diff -u <(printf '%s\n' "${files[@]}") \
            <(find public -type f -printf '%P\n' | sort)
          test -z "$(find public ! -type d ! -type f -print -quit)"
          test "$(find public -type d -printf '.\n' | wc -l)" -eq 3
          diff -u \
            <(printf '%s\n' .github/workflows/pages.yml; printf 'public/%s\n' "${files[@]}") \
            <(git ls-files | sort)

          total=0
          for file in "${files[@]}"; do
            test -f "public/$file"
            test ! -L "public/$file"
            test "$(stat -c %h "public/$file")" -eq 1
            total=$((total + $(stat -c %s "public/$file")))
          done
          test "$total" -eq 906227
          test "$total" -le 2097152

          # October 7 scoped same-day comparison: artifact manifest SHA256: cdf8bf40f9b391c0e2513ae5646024055ec33304173d0d84661fa3fae68ddfa3.
          # Validated and staged on mi300x-2; no build or test runs in this deploy-only job.
          sha256sum --check --strict <<'SHA256'
          f634e4c1fbc7aaa242a16679cef2ba2bdce052a077e92ed88625312a8bce52fb  public/app.js
          07291c88f57be83ac12bccc73876fb67158ed96ca8efc2e5717d50d98ad9cb69  public/assets/architecture.svg
          5ddc6e2efcaa8eea3fd8f5607cae74813da636f180a34a5ba72cd879e1b6b809  public/assets/mark.svg
          43fe0f336555f2f08740a8538013a80c3d853893ffb88ca9108820b30a9ae7fe  public/data/performance.js
          0316cacef9eb519b2db14dd50b4ba6a88e0e932bdca28ce125cf5e83a342b846  public/data/project.js
          b71965abbd0e9304327dd2992ae4f930930f26d056730e03e4ccefd8498948b1  public/index.html
          41921ee0f120656ab2b13075077948324e6c56d124497886169dbd20d51fdc58  public/styles.css
          SHA256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload admitted static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
