name: pages-prebuilt

on:
  push:
    branches:
      - pages/prebuilt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'harsh-nod/ferric' && github.ref == 'refs/heads/pages/prebuilt'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out exact prebuilt revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate the admitted static artifact
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          test "$GITHUB_REPOSITORY" = harsh-nod/ferric
          test "$GITHUB_REF" = refs/heads/pages/prebuilt
          test -d public
          test ! -L public
          test -d public/assets
          test ! -L public/assets
          test -d public/data
          test ! -L public/data

          files=(
            app.js
            assets/architecture.svg
            assets/mark.svg
            data/performance.js
            data/project.js
            index.html
            styles.css
          )
          diff -u <(printf '%s\n' "${files[@]}") \
            <(find public -type f -printf '%P\n' | sort)
          test -z "$(find public ! -type d ! -type f -print -quit)"
          test "$(find public -type d -printf '.\n' | wc -l)" -eq 3
          diff -u \
            <(printf '%s\n' .github/workflows/pages.yml; printf 'public/%s\n' "${files[@]}") \
            <(git ls-files | sort)

          total=0
          for file in "${files[@]}"; do
            test -f "public/$file"
            test ! -L "public/$file"
            test "$(stat -c %h "public/$file")" -eq 1
            total=$((total + $(stat -c %s "public/$file")))
          done
          test "$total" -eq 879138
          test "$total" -le 2097152

          # October 1 V11 prefill checkpoint: static artifact archive SHA256: b77f03db661c0b9cd516a65a156cd70db07c4a6e81fdedd30ef411e83862db36.
          # Existing deploy-only protections retained; remote QA approval is recorded externally.
          sha256sum --check --strict <<'SHA256'
          a9c145b4643a7271896437012b293131c7d14ab2e5d4694726e555f5ce288275  public/app.js
          07291c88f57be83ac12bccc73876fb67158ed96ca8efc2e5717d50d98ad9cb69  public/assets/architecture.svg
          5ddc6e2efcaa8eea3fd8f5607cae74813da636f180a34a5ba72cd879e1b6b809  public/assets/mark.svg
          05ad1f50575547c0b0c8244b2912e1d7518258772527f7ff236fdb8d2e42102f  public/data/performance.js
          857754b56e66d61ff5b752e141dee2285cdf5d60554e0537ee976d8ff8c26d1a  public/data/project.js
          c44bf010ba6b00a7fa2473fa3c3f94717d2e7b26619bb9f5ac1a5c14dae6047d  public/index.html
          41921ee0f120656ab2b13075077948324e6c56d124497886169dbd20d51fdc58  public/styles.css
          SHA256

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload admitted static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
