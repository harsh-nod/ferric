name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # This isolated engineering tool is not part of the Verus-qualified runtime.
      - run: cargo fmt --manifest-path tools/megakernel-planner/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/megakernel-planner/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/megakernel-planner/Cargo.toml --locked
      - run: cargo fmt --manifest-path tools/task-graph-model/Cargo.toml -- --check
      - run: cargo clippy --manifest-path tools/task-graph-model/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path tools/task-graph-model/Cargo.toml --locked

  megakernel-measurement-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Synthetic protocol tests only, not GPU or numerical qualification.
      - run: python3 -I qualification/gfx950-megakernel/test_validate.py
      - run: python3 -B -I qualification/gfx950-decoder-layer-f32-v1/test_reference.py
      - run: python3 -B -I qualification/gfx950-decoder-layer-f32-v1/test_summary.py
      # Replays recorded output against an independent CPU reference, not a GPU run.
      - run: python3 -B -I qualification/gfx950-decoder-layer-f32-v1/test_recorded_results.py
      # Independent reference and hostile-evidence unit tests, without a GPU or weights download.
      - run: python3 -B -m unittest -v test_reference
        working-directory: qualification/gfx950-task-graph-v1
      - run: python3 -B -m unittest -v test_reference test_binding
        working-directory: qualification/gfx950-qwen3-kproj-v1
      - run: python3 -B -m unittest -v test_reference test_binding
        working-directory: qualification/gfx950-qwen3-kproj-wave64-v1
      - run: bash -n qualification/gfx950-task-graph-v1/build.sh qualification/gfx950-task-graph-v1/verify.sh qualification/gfx950-task-graph-v1/verify-suite.sh
      - run: bash -n qualification/gfx950-qwen3-kproj-v1/build.sh qualification/gfx950-qwen3-kproj-v1/verify.sh
      - run: bash -n qualification/gfx950-qwen3-kproj-wave64-v1/build.sh qualification/gfx950-qwen3-kproj-wave64-v1/verify.sh

  finite-decoder-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ferric
    steps:
      - uses: actions/checkout@v4
        with:
          path: ferric
      - uses: actions/checkout@v4
        with:
          repository: harsh-nod/fe2o3
          ref: 1989681e50bbc5ab97eadec6f22dd9e7ebca68eb
          path: fe2o3
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/gfx950-finite-probe/Cargo.toml --check
      - run: cargo test --manifest-path tools/gfx950-finite-probe/Cargo.toml --locked
      - run: cargo clippy --manifest-path tools/gfx950-finite-probe/Cargo.toml --all-targets --locked -- -D warnings

  device-binding-tests:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-04-03
    strategy:
      fail-fast: false
      matrix:
        kernel: [qwen3-swiglu-v1, gfx950-qwen3-kproj-v1, gfx950-qwen3-kproj-wave64-v1, gfx950-task-graph-v1]
    defaults:
      run:
        working-directory: device/${{ matrix.kernel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: "nightly-2026-04-03"
          components: rust-src, rustc-dev, rustfmt
      - name: Install reviewed binding-only host-test tool
        run: >-
          cargo install --locked
          --git https://github.com/harsh-nod/fe2o3.git
          --rev 1739669000eea19614fdf772127f4d5d705530c0
          --root "$RUNNER_TEMP/cargo-fe2o3"
          cargo-fe2o3
      - run: cargo fmt --all --check
      # Namespace-free typed kernels require the documented binding-only route.
      # cargo-fe2o3 has no managed clippy lane; do not bypass binding to invoke it.
      - name: Check all host targets through compiler-derived binding
        run: >-
          "$RUNNER_TEMP/cargo-fe2o3/bin/cargo-fe2o3"
          fe2o3 check --locked --all-targets
      - name: Test all host targets through compiler-derived binding
        run: >-
          "$RUNNER_TEMP/cargo-fe2o3/bin/cargo-fe2o3"
          fe2o3 test --locked --all-targets
