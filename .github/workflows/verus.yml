name: authenticated-verus-release

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install admitted Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.97.1
          rustc --version

      - name: Download and authenticate Verus archive
        env:
          VERUS_VERSION: 0.2026.08.02.b677dd5
        run: |
          set -eu
          archive="$RUNNER_TEMP/verus.zip"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/verus-lang/verus/releases/download/release/${VERUS_VERSION}/verus-${VERUS_VERSION}-x86-linux.zip"
          printf '%s  %s\n' \
            "$(cat proofs/verus/VERUS_ARCHIVE_SHA256)" "$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/verus"
          unzip -q "$archive" -d "$RUNNER_TEMP/verus"
          proofs/verify-verus-closure.sh \
            "$RUNNER_TEMP/verus/verus-x86-linux" \
            proofs/verus/VERUS_CLOSURE_MANIFEST

      - name: Qualify exact proof and release artifacts
        env:
          VERUS_ROOT: ${{ runner.temp }}/verus/verus-x86-linux
          FERRIC_RECEIPT_DIR: ${{ runner.temp }}/ferric-receipt
          FERRIC_PROOF_TIMEOUT_SECONDS: "3600"
        run: proofs/qualify-release.sh

      - name: Retain qualification receipt and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ferric-verus-qualification
          path: ${{ runner.temp }}/ferric-receipt
          if-no-files-found: error
          retention-days: 30
